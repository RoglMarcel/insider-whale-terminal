name: CI

# Quality gate. Until this existed, `scrape.yml` was the ONLY workflow: it
# scraped, built the site and deployed it — with no typecheck, no test and no
# scoring regression check anywhere in the path. A push that broke the score
# model was published.
#
# Deliberately separate from scrape.yml rather than bolted onto it:
#  - scrape.yml commits the history DB with [skip ci], so its own commits must
#    not trigger a second workflow (see the paths-ignore + skip guard below);
#  - a scrape takes minutes and needs Chromium; this must stay fast enough that
#    it is worth waiting for.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'data/insider-tracker.db'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'data/insider-tracker.db'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The scheduled scrape commits `data/insider-tracker.db` with [skip ci];
    # paths-ignore covers that, and this is the belt to its braces.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `--ignore-scripts` on purpose: the postinstall rebuilds better-sqlite3
      # for the ELECTRON ABI, which is wrong for a runner that only typechecks,
      # tests and builds. Nothing in this job opens the database.
      - name: Install deps
        run: npm ci --ignore-scripts

      # Both projects: tsconfig.json (renderer) and tsconfig.node.json
      # (electron + scripts + tests + build configs).
      - name: History persistence regression checks
        run: python3 -m unittest discover -s tests/persistence -v

      - name: Desktop snapshot delivery integration
        run: |
          npm rebuild better-sqlite3 --build-from-source
          npx esbuild electron/webPublish.ts --bundle --platform=node --format=cjs --external:better-sqlite3 --alias:electron=./scripts/electron-stub.ts --outfile=tmp/web-publish-test.cjs
          node tests/persistence/desktop-publish.integration.cjs
          npx esbuild electron/database.ts --bundle --platform=node --format=cjs --external:better-sqlite3 --alias:electron=./scripts/electron-stub.ts --outfile=tmp/experiment-db-test.cjs
          node tests/persistence/portfolio-experiment.integration.cjs
          node tests/persistence/trade-revisions.integration.cjs
          node tests/persistence/track-cache.integration.cjs
          npm run verify:backtest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrapling public-data adapters
        run: |
          python -m pip install -r scripts/scrapling/requirements.txt
          python -m unittest discover -s tests/scrapling -v

      - name: Typecheck
        run: npm run typecheck

      # Pure unit / invariant / golden tests — no browser, no DB, no network.
      - name: Unit tests
        run: npm test

      # The scoring regression bar. Must stay green, or the expectation is
      # updated deliberately and the reason documented.
      - name: Scoring regression check
        run: npm run verify:scoring

      - name: Build (desktop renderer + main)
        run: npm run build

      - name: Build (web)
        run: npm run build:web

  web-ui:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Public UI on desktop, tablet and phones
        run: node tests/ui/web-ui.cjs
      - run: npm run build
      - name: Backtest Web and Desktop UI
        run: node tests/ui/backtest-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-review
          path: |
            tmp/ui
            tmp/backtest-ui
          retention-days: 7
