name: Windows Desktop

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'build/windows-*']
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'build/**'
      - 'package*.json'
      - 'electron-builder.json'
      - '*config*'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for the packaged Electron runtime.
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build Windows installer
        run: npm run dist:win -- --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "insider-whale-terminal-setup-$version.exe"
          foreach ($file in @($installer, "$installer.blockmap", 'latest.yml')) {
            if (!(Test-Path "release/$file") -or (Get-Item "release/$file").Length -eq 0) {
              throw "Missing or empty release file: $file"
            }
          }
          $manifest = Get-Content release/latest.yml -Raw
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes("$PWD/release/$installer")))
          if (!$manifest.Contains("version: $version") -or !$manifest.Contains($installer) -or !$manifest.Contains($sha512)) {
            throw 'Update metadata does not match the generated installer'
          }
          "Verified Windows $version installer, blockmap and SHA-512 update manifest."
      - uses: actions/upload-artifact@v4
        with:
          name: insider-whale-windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
