name: Windows Desktop

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'build/windows-*']
    tags: ['v*']
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'build/**'
      - 'package*.json'
      - 'electron-builder.json'
      - 'scripts/scrapling/**'
      - 'scripts/ensure-scrapling-runtime.cjs'
      - '*config*'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'RoglMarcel/insider-whale-terminal' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/build/windows-'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for the packaged Electron runtime.
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit regression tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained Scrapling runtime
        run: |
          python -m pip install -r scripts/scrapling/build-requirements.txt
          python scripts/scrapling/build-runtime.py
      - name: Bundle shared dated analysis snapshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/data | Out-Null
          foreach ($file in @('analysis-cache.json.gz', 'analysis-index.json', 'analysis-summary.json')) {
            Invoke-WebRequest "https://roglmarcel.github.io/insider-whale-web/data/$file" -OutFile "public/data/$file" -TimeoutSec 30
          }
          $index = Get-Content public/data/analysis-index.json -Raw | ConvertFrom-Json
          if (!$index.stocks -or !$index.generatedAt) { throw 'Invalid shared analysis catalogue' }
      - name: Build Windows installer
        run: npm run dist:win -- --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "insider-whale-terminal-setup-$version.exe"
          foreach ($file in @($installer, "$installer.blockmap", 'latest.yml')) {
            if (!(Test-Path "release/$file") -or (Get-Item "release/$file").Length -eq 0) {
              throw "Missing or empty release file: $file"
            }
          }
          $manifest = Get-Content release/latest.yml -Raw
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes("$PWD/release/$installer")))
          if (!$manifest.Contains("version: $version") -or !$manifest.Contains($installer) -or !$manifest.Contains($sha512)) {
            throw 'Update metadata does not match the generated installer'
          }
          "Verified Windows $version installer, blockmap and SHA-512 update manifest."
      - uses: actions/upload-artifact@v4
        with:
          name: insider-whale-windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish new regular desktop release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Release tag/version mismatch' }
          gh release create $env:GITHUB_REF_NAME "release/insider-whale-terminal-setup-$version.exe" "release/insider-whale-terminal-setup-$version.exe.blockmap" release/latest.yml --verify-tag --title "Insider & Whale Terminal $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release publication failed' }
